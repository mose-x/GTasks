<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GTasks</title>
    <script>
      // 抢在第一帧之前把 data-theme 挂上：Go 侧才是主题的事实来源，这里先用
      // localStorage 的缓存值上色，app.js 拿到 /api/theme 再校正，深色模式下
      // 就不会先闪一帧白底。
      (function () {
        var mode = "system";
        try {
          mode = localStorage.getItem("gtasks-theme") || "system";
        } catch (error) {}
        var dark = mode === "dark" || (mode === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <script type="module" src="/wails/runtime.js"></script>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="banner" class="banner" hidden></div>

    <div class="app">
      <!-- ------------------------------------------------------------ 侧栏 -->
      <aside class="sidebar">
        <div class="sidebar-head">
          <span class="logo" aria-hidden="true">
            <svg viewBox="44 38 104 104" width="17" height="17">
              <path
                fill="none"
                stroke="#fff"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="15"
                d="m61 90 22.172 22.172a4 4 0 0 0 5.656 0L138 63"
              />
            </svg>
          </span>
          <h1 data-i18n="main.title">任务</h1>
          <div class="sidebar-tools">
            <button class="icon-btn" id="btnTheme" title="主题：跟随系统" data-i18n-title="main.themeTitle"></button>
            <button class="icon-btn" id="btnLang" title="语言：简体中文" data-i18n-title="main.langTitle"></button>
            <button class="icon-btn wide" id="btnDemo" title="切换演示数据" data-i18n-title="main.demoTitle">
              <span data-i18n="main.demo">演示</span>
            </button>
            <button class="icon-btn" id="btnNewList" title="创建新清单" data-i18n-title="main.newListTitle">
              <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" /></svg>
            </button>
          </div>
        </div>
        <nav id="listNav" class="list-nav"></nav>
        <div class="sidebar-foot">
          <span class="account" id="accountLabel" title="当前 Google 账号" data-i18n-title="main.accountTitle"></span>
          <button class="icon-btn" id="btnRefresh" title="刷新" data-i18n-title="main.refreshTitle">
            <svg viewBox="0 0 24 24">
              <path
                d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-8 8s3.57 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"
              />
            </svg>
          </button>
        </div>
      </aside>

      <!-- ---------------------------------------------------------- 任务列表 -->
      <section class="main">
        <header class="main-head">
          <h2 id="listTitle" data-i18n="main.allTasks">所有任务</h2>
          <button class="icon-btn" id="btnListMenu" title="清单操作" data-i18n-title="main.listMenuTitle">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"
              />
            </svg>
          </button>
        </header>

        <div id="taskList" class="task-list"></div>

        <div class="composer">
          <button class="add-circle" id="btnAddTask" title="添加任务" data-i18n-title="main.addTask">
            <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" /></svg>
          </button>
          <input
            id="inputNewTask"
            type="text"
            placeholder="添加任务"
            autocomplete="off"
            data-i18n-placeholder="main.addTask"
          />
          <button class="icon-btn" id="btnNewTaskDate" title="添加日期/时间" data-i18n-title="main.addDateTitle">
            <svg viewBox="0 0 24 24">
              <path
                d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"
              />
            </svg>
          </button>
        </div>
      </section>

      <!-- ---------------------------------------------------------- 详情面板 -->
      <aside class="detail" id="detailPanel" hidden>
        <header class="detail-head">
          <h3 data-i18n="main.detailTitle">任务详情</h3>
          <button class="icon-btn" id="btnCloseDetail" title="关闭" data-i18n-title="main.closeTitle">
            <svg viewBox="0 0 24 24">
              <path
                d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
              />
            </svg>
          </button>
        </header>
        <div class="detail-body" id="detailBody"></div>
        <footer class="detail-foot">
          <button class="icon-btn danger" id="btnDeleteTask" title="删除任务" data-i18n-title="main.deleteTaskTitle">
            <svg viewBox="0 0 24 24">
              <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" />
            </svg>
          </button>
        </footer>
      </aside>
    </div>

    <div id="toast" class="toast"></div>
    <script src="/shared.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
